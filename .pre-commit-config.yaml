repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        args:
          - --rcfile=pylintrc
        files: ^(gulfofmexico|scripts)/.*\.py$
      - id: check-zeroarg-dotted-calls
        name: check-zeroarg-dotted-calls
        entry: python scripts/check_zeroarg_calls.py
        language: system
        files: '^.*\\.gom$'
      - id: fix-zeroarg-dotted-calls
        name: fix-zeroarg-dotted-calls
        entry: python scripts/check_zeroarg_calls.py
        language: system
        files: '^.*\\.gom$'
        args: ['--fix']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
