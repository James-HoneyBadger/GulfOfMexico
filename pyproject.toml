[tool.poetry]
name = "gulfofmexico"
version = "1.2.0"
description = "Production-ready interpreter and IDE for the Gulf of Mexico esoteric programming language, featuring probabilistic variables, negative indexing, temporal lifetimes, and a modern graphical IDE. Based on Lu Wilson's (TodePond) conceptual design."
readme = "README.md"
authors = ["James Temple <james@honey-badger.org>"]
license = "MIT"
repository = "https://github.com/James-HoneyBadger/GulfOfMexico"
homepage = "https://github.com/James-HoneyBadger/GulfOfMexico"
documentation = "https://github.com/James-HoneyBadger/GulfOfMexico/blob/main/docs/LANGUAGE_REFERENCE.md"
keywords = ["interpreter", "esoteric", "programming-language", "language-construction", "dsl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pynput = {version = "^1.7.7", optional = true}
pygithub = {version = "^2.5.0", optional = true}
PySide6 = {version = "^6.6", optional = true}
Pillow = {version = "^13.0.0", optional = true}
pyyaml = {version = "^6.0", optional = true}


[tool.poetry.scripts]
gulfofmexico = "gulfofmexico.__main__:main"
gom = "gulfofmexico.__main__:main"
gom-ide = "gulfofmexico.ide.app:run"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
mypy = "^1.13.0"
pylint = "^3.3.0"
ruff = "^0.7.4"
pre-commit = "^4.0.0"

[tool.poetry.extras]
input = ["pynput"]
globals = ["pygithub"]
ide = ["PySide6"]
graphics = ["Pillow"]
yaml = ["pyyaml"]
all = ["pynput", "pygithub", "PySide6", "Pillow", "pyyaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gulfofmexico"]
omit = ["gulfofmexico/ide/*"]
# The example and CLI tests run programs in subprocesses; measure those too.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.11"
files = ["gulfofmexico"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
