[tool.poetry]
name = "gulfofmexico"
version = "0.2.0"
description = "Experimental interpreter based on Lu Wilson's (TodePond) Gulf of Mexico conceptual design - featuring probabilistic variables, negative indexing, and temporal lifetimes"
readme = "README.md"
authors = ["James Temple <james@honey-badger.org>"]
license = "MIT"
repository = "https://github.com/James-HoneyBadger/GulfOfMexico"
homepage = "https://github.com/James-HoneyBadger/GulfOfMexico"
documentation = "https://github.com/James-HoneyBadger/GulfOfMexico/blob/main/docs/LANGUAGE_REFERENCE.md"
keywords = ["interpreter", "esoteric", "programming-language", "language-construction", "dsl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
pynput = {version = "^1.7.7", optional = true}
pygithub = {version = "^2.5.0", optional = true}
PySide6 = {version = "^6.6", optional = true}
Pillow = {version = "^12.1.1", optional = true}
pyyaml = {version = "^6.0", optional = true}


[tool.poetry.scripts]
gulfofmexico = "gulfofmexico.__main__:main"
gom = "gulfofmexico.__main__:main"
gom-ide = "gulfofmexico.ide.app:run"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pylint = "^3.3.0"
ruff = "^0.7.4"
pre-commit = "^4.0.0"

[tool.poetry.extras]
input = ["pynput"]
globals = ["pygithub"]
ide = ["PySide6"]
graphics = ["Pillow"]
yaml = ["pyyaml"]
all = ["pynput", "pygithub", "PySide6", "Pillow", "pyyaml"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
